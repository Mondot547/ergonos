name: Générer le SQL initial
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > init.sql
      - run: echo "=====SQL-BEGIN====="; cat init.sql; echo "=====SQL-END====="
      - uses: actions/upload-artifact@v4
        with: { name: init-sql, path: init.sql }
